<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Local IP file finder support page">
    <title>Local IP File Finder | Important Files</title>
    <style>

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 4vw, 2rem);
        background: radial-gradient(circle at top, #18182d 0%, var(--bg) 60%);
        color: var(--text);
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        line-height: 1.6;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.15;
        color: var(--accent);
      }

      p {
        margin: 0 0 1rem;
        color: var(--muted);
        font-size: 1.05rem;
      }

      a {
        color: var(--text);
        text-decoration: none;
        transition: opacity 0.2s ease, text-decoration-color 0.2s ease;
      }

      a:hover,
      a:focus-visible {
        opacity: 0.9;
        text-decoration: underline;
        text-decoration-color: var(--accent-2);
      }
    </style>
  </head>

    <main>
      <h1>Important files for the Local IP file finder</h1>
