<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jaxson's developer page">
    <meta name="theme-color" content="#660099">
    <title>About the Developer | Jaxson</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        --accent: #660099;
        --background: #fefefe;
        --text: #222;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: clamp(1rem, 4vw, 2rem);
        place-items: center;
        background-color: var(--background);
        color: var(--text);
      }

      main {
        width: min(100%, 40rem);
        padding: clamp(1.25rem, 5vw, 2rem);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        color: var(--accent);
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      p {
        margin: 0;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--accent);
        color: #fff;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jaxson the Benny Developer Page</h1>
      <p>Uses Claude for his projects 🍅</p>
    </main>
  </body>
</html>
