<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jaxson's developer page">
    <meta name="theme-color" content="#660099">
    <title>About the Developer | Jaxson</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        --accent: #bb00ff;
        --background: #000;
        --surface: #660099;
        --text: #fff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: clamp(1rem, 4vw, 2rem);
        place-items: center;
        background-color: var(--background);
        color: var(--text);
      }

      main {
        width: min(100%, 40rem);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        color: var(--accent);
        font-family: "Comic Sans MS", "Comic Sans", cursive;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      img {
        display: block;
        width: min(100%, 25rem);
        height: auto;
        margin: 0 auto 1rem;
        border-radius: 0.5rem;
      }

      p {
        margin: 0 0 0.5rem;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: var(--surface);
        color: var(--text);
        line-height: 1.5;
      }
      a {
        margin: 0 0 1.5rem;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: #BB00FF;
        color: var(--text);
        line-height: 1.5;
      }

      p:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jaxson the Benny Developer Page</h1>
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy4WpsgNEjnx4e7ipK28PQjucjnGmyox29_p8ZquTFNQ&amp;s=10"
        alt="Developer profile image"
        width="400"
        height="400"
        loading="lazy"
        decoding="async"
      >
      <p>Uses Claude for his projects 🍅</p>
      <p>Makes stuff that may be useful! 😊</p>
      <p>Is learning HTML and soon BrightScript 🚀</p>
      <p>If You Are Coming From The Roku Store, Go Ahead And Scroll Down</p>
      <a href="https://jaxson-developerpage.vercel.app/localip">Important Files For "Local Ip file finder."</a>
    </main>
  </body>
</html>
