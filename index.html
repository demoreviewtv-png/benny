<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jaxson's developer page">
    <title>About the Developer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
        place-items: center;
        background-color: #fefefe;
        color: #222;
      }

      main {
        width: min(100%, 40rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        color: #660099;
        font-family: "Comic Sans MS", cursive, sans-serif;
        line-height: 1.2;
      }

      p {
        margin: 0;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: #660099;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jaxson the Benny Developer Page</h1>
      <p>Uses Claude for his projects 🍅</p>
    </main>
  </body>
</html>
